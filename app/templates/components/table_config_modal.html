<div class="modal-overlay" id="tableConfigModalOverlay" style="display: none;">
  <div class="modal-content table-config-modal">
    <div class="modal-header">
      <h2>Cấu hình hiển thị</h2>
      <button class="btn-close-modal" id="btnConfigClose" title="Đóng">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="modal-body p-0">
      <div class="table-config-wrapper">
        <table class="table-config-list">
          <thead>
            <tr>
              <th style="width: 60px; text-align: center;">STT</th>
              <th style="text-align: center;">Tên cột</th>
              <th style="width: 80px; text-align: center;">Hiển thị</th>
              <th style="width: 140px; text-align: center;">Căn lề</th>
              <th style="width: 120px; text-align: center;">Chiều rộng</th>
              <th style="width: 80px; text-align: center;">Thứ tự</th>
            </tr>
          </thead>
          <tbody id="tableConfigBody">
            <!-- JS will render rows here -->
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="btnConfigReset" title="Trở về cấu hình gốc của hệ thống">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        Khôi phục mặc định
      </button>
      <button type="button" class="btn" id="btnConfigAutoFit" title="Tự động tính toán chiều rộng dựa trên độ dài tên cột">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14h6v6"></path>
          <path d="M4 14l7-7"></path>
          <path d="M20 10h-6V4"></path>
          <path d="M20 10l-7 7"></path>
        </svg>
        Căn tự động theo tiêu đề
      </button>
      <div class="spacer"></div>
      <button class="btn" id="btnConfigCancel">Đóng</button>
      <button class="btn btn-primary" id="btnConfigSave">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Lưu
      </button>
    </div>
  </div>
</div>
