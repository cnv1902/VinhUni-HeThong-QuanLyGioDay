<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Hệ thống quản lý giờ dạy Đại học Vinh{% endblock %}</title>
  <link rel="icon" type="image/ico" href="/static/images/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/navbar.css">
  <link rel="stylesheet" href="/static/css/sidebar.css">
  <link rel="stylesheet" href="/static/css/content.css">
  <link rel="stylesheet" href="/static/css/components/table.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/footer.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>

<body>
  <div class="app">
    {% include 'layouts/navbar.html' %}
    <div class="app-body">
      {% include 'layouts/sidebar.html' %}
      <main id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% include 'layouts/footer.html' %}
  </div>
  <div class="toast-stack" id="toastStack"></div>

  <script src="/static/js/core/constants.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/components/toast.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
