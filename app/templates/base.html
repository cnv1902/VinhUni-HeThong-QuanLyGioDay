<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Hệ thống quản lý giờ dạy Đại học Vinh{% endblock %}</title>
  <link rel="icon" type="image/ico" href="/static/images/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/layout.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/navbar.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/sidebar.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/content.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/components/table.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/components.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/components/toast.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/footer.css?v={{ CACHE_BUSTER() }}">
  <link rel="stylesheet" href="/static/css/responsive.css?v={{ CACHE_BUSTER() }}">
  <script>window.API_PREFIX = "{{ API_PREFIX }}";</script>
  {% block styles %}{% endblock %}
</head>

<body>
  <div class="app">
    {% include 'layouts/navbar.html' %}
    <div class="app-body">
      {% include 'layouts/sidebar.html' %}
      <main id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% include 'layouts/footer.html' %}
  </div>
  {% include 'components/toast.html' %}
  {% include 'components/confirm_modal.html' %}

  <script src="/static/js/core/constants.js?v={{ CACHE_BUSTER() }}"></script>
  <script src="/static/js/core/utils.js?v={{ CACHE_BUSTER() }}"></script>
  <script src="/static/js/components/toast.js?v={{ CACHE_BUSTER() }}"></script>
  <script src="/static/js/components/confirm_modal.js?v={{ CACHE_BUSTER() }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
