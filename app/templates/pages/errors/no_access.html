<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-800: #0055AF;
            --brand-700: #1568C4;
            --bg-page: #EEF1F4;
            --bg-panel: #FFFFFF;
            --border: #DCE3E9;
            --text-primary: #182430;
            --text-secondary: #5B6B78;
            --red-600: #B23A2E;
            --red-50: #FBE8E5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-primary);
        }

        .error-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: none;
        }

        .error-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--red-50);
            color: var(--red-600);
            margin-bottom: 24px;
        }

        .error-icon svg {
            width: 32px;
            height: 32px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 20px;
            background-color: var(--brand-800);
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--brand-700);
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="error-title">Truy cập bị từ chối</h1>
        <p class="error-message">Phiên đăng nhập của bạn đã hết hạn hoặc bạn không có quyền truy cập vào hệ thống Quản
            lý Giờ dạy. Vui lòng đăng nhập lại thông qua Cổng Cán Bộ.</p>

        <!-- Nút này trỏ về Cổng Cán Bộ. Trong thực tế bạn thay bằng URL gốc của Cổng Cán Bộ -->
        <a href="https://canbo.covit.site" class="btn-primary">Quay lại Cổng Cán Bộ</a>
    </div>
</body>

</html>
