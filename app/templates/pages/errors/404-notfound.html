<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/ico" href="/static/images/logo/favicon.ico">
<title>404 — Không tìm thấy trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/pages/404-notfound.css">
</head>
<body>
  <main>
    <div class="hero">

      <div class="icon-wrap">
        <div class="orbit-mark q">?</div>
        <div class="orbit-mark e">!</div>

        <svg viewBox="0 0 172 172" width="190" height="190" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
          <path class="sparkle s1" d="M20 36 l3 8 8 3 -8 3 -3 8 -3-8-8-3 8-3z" fill="var(--teal-600)"/>
          <path class="sparkle s2" d="M150 112 l2.5 6.5 6.5 2.5 -6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="var(--brand-800)"/>

          <g class="icon-float">
            <!-- sweat drop -->
            <path class="sweat" d="M112 30 C112 34 108 37 105 34 C103 32 104 28 108 24 C110 26 112 28 112 30 Z" fill="var(--blue-600)" opacity="0.85"/>

            <!-- handle -->
            <rect x="96" y="96" width="46" height="16" rx="8" transform="rotate(45 96 96)" fill="var(--teal-600)"/>
            <!-- lens -->
            <circle cx="76" cy="76" r="54" fill="var(--bg-panel)" stroke="var(--brand-800)" stroke-width="7"/>

            <!-- dizzy spiral eyes -->
            <g class="eye-spiral left" transform="translate(58,72)">
              <path d="M0,-7 C 5,-7 7,-3 5,1 C 3,4 -2,4 -3,1 C -4,-1 -2,-3 0,-2" stroke="var(--text-primary)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
            </g>
            <g class="eye-spiral right" transform="translate(90,72)">
              <path d="M0,-7 C 5,-7 7,-3 5,1 C 3,4 -2,4 -3,1 C -4,-1 -2,-3 0,-2" stroke="var(--text-primary)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
            </g>

            <!-- shocked open mouth -->
            <ellipse cx="76" cy="100" rx="9" ry="11" fill="var(--bg-subtle)" stroke="var(--text-primary)" stroke-width="3"/>
          </g>
        </svg>
      </div>

      <div class="code-block">
        <div class="code-number">404</div>
        <div class="stamp">Not Found</div>
      </div>

      <h1>Không tìm thấy trang</h1>
      <p class="subtext">
        Đường dẫn bạn truy cập không tồn tại hoặc đã được thay đổi.
        Vui lòng kiểm tra lại địa chỉ hoặc quay về trang chủ.
      </p>

      <div class="cta-row">
        <a href="/" class="btn btn-primary">Về trang chủ</a>
      </div>

      <div class="footnote">Mã lỗi: 404</div>
    </div>
  </main>
</body>
</html>
