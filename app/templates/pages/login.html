{% extends 'auth_base.html' %}

{% block content %}
<div class="auth-container">
  
  <!-- Cột Banner Trái -->
  <div class="auth-banner">
    <!-- Hình nền sẽ được CSS render -->
  </div>

  <!-- Cột Form Phải -->
  <div class="auth-form-wrapper">
    <div class="auth-form-inner">
      <img src="/static/images/logo/dhv_logo.png" alt="Logo Đại học Vinh" class="auth-logo">
      
      <h2 class="auth-title">Đăng nhập hệ thống</h2>
      <p class="auth-subtitle">Cổng thông tin nội bộ dành cho Cán bộ & Giảng viên</p>

      <form id="loginForm" class="auth-form" onsubmit="return false;">
        <div class="form-group">
          <label for="username">Tên đăng nhập hoặc Mã số cán bộ</label>
          <input type="text" id="username" class="text-input" placeholder="Nhập tên đăng nhập" required autofocus>
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="text-input" placeholder="Nhập mật khẩu" required>
            <button type="button" class="btn-toggle-password" id="btnTogglePassword" title="Hiển thị mật khẩu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="cb-remember">
            <input type="checkbox" id="rememberMe">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          Đăng nhập
        </button>
      </form>

      <div class="auth-divider">
        <span>hoặc</span>
      </div>

      <button type="button" class="btn btn-work-mail btn-block" id="btnWorkMail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Đăng nhập bằng Mail công việc
      </button>

      <div class="auth-footer">
        <p>&copy; 2026 Trường Đại học Vinh. All rights reserved.</p>
        <p>Hỗ trợ kỹ thuật: 1900 xxxx - it@vinhuni.edu.vn</p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
