<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vinhuni Gateway - Frontend</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin-top: 20px; }
        pre { background: #eee; padding: 10px; border-radius: 5px; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <h1>👋 Chào mừng đến với Giao Diện (Frontend)</h1>
    <p>Trang HTML này được nạp tự động từ thư mục <code>static/</code> mà không cần viết Route <code>@app.get("/")</code> trong mã nguồn.</p>
    
    <div class="card">
        <h3>Kiểm tra gọi API (Client-side)</h3>
        <button onclick="fetchUsers()">Lấy danh sách Users từ API</button>
        <pre id="result">Kết quả sẽ hiển thị ở đây...</pre>
    </div>

    <script>
        async function fetchUsers() {
            const resultBox = document.getElementById('result');
            resultBox.innerText = "Đang tải dữ liệu...";
            try {
                // Sử dụng AJAX (Fetch) để gọi thẳng vào API Router
                const response = await fetch('/api/v1/users/');
                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultBox.innerText = "Lỗi khi gọi API: " + error.message;
            }
        }
    </script>
</body>
</html>
