<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý nhóm lớp học phần — Hệ chính quy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#003e7a; --navy-800:#0055a5; --navy-700:#1a6bb5;
  --teal-600:#0E7C7B; --teal-700:#0A5F5E; --teal-50:#E6F4F3;
  --bg-page:#EEF1F4; --bg-panel:#FFFFFF; --bg-subtle:#F4F6F8; --bg-subtle-2:#EAEDF0;
  --border:#DCE3E9; --border-strong:#C3CDD5;
  --text-primary:#182430; --text-secondary:#5B6B78; --text-muted:#96A3AD;
  --green-600:#1E7A4C; --green-50:#E5F3EA;
  --amber-600:#A8710D; --amber-50:#FBF0DA;
  --red-600:#B23A2E; --red-50:#FBE8E5;
  --blue-600:#2560A6; --blue-50:#E6F0FA;
  --radius:6px;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg-page);}
body{font-family:var(--font-sans);color:var(--text-primary);font-size:14px;}
button,select,input{font-family:inherit;font-size:13px;color:var(--text-primary);}

.app{max-width:1500px;margin:0 auto;min-height:100vh;background:var(--bg-page);display:flex;flex-direction:column;}

/* Topbar */
.topbar{background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;flex:0 0 auto;}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:32px;height:32px;border-radius:var(--radius);background:var(--navy-700);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand-mark svg{width:18px;height:18px;}
.brand-text h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand-text p{font-size:11.5px;margin:1px 0 0;color:#B7C6D3;}
.topbar .who{display:flex;align-items:center;gap:14px;}
.who-tag{font-size:12px;color:#C7D5E0;border:1px solid #2B4A66;padding:4px 10px;border-radius:var(--radius);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}

/* Toolbar */
.toolbar{background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap;flex:0 0 auto;}
.tb-group{display:flex;align-items:center;gap:8px;}
.tb-label{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;}
.tb-sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px;}
.spacer{flex:1;}

select,.text-input{height:32px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--bg-panel);padding:0 10px;color:var(--text-primary);}
select:focus,.text-input:focus,input:focus{outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px var(--teal-50);}

.btn{height:32px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--bg-panel);padding:0 13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;color:var(--text-primary);}
.btn svg{width:14px;height:14px;flex:0 0 auto;}
.btn:hover{background:var(--bg-subtle);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy-800);border-color:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-teal{border-color:var(--teal-600);color:var(--teal-700);}
.btn-teal:hover{background:var(--teal-50);}
.btn-filter{position:relative;}
.filter-count{position:absolute;top:-6px;right:-6px;background:var(--teal-600);color:#fff;font-size:10px;line-height:16px;height:16px;min-width:16px;border-radius:8px;text-align:center;padding:0 3px;}
.chev{transition:transform .15s;}
.btn-filter.open .chev{transform:rotate(180deg);}

/* Filter panel */
.filter-panel{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:16px 24px;flex:0 0 auto;}
.filter-panel.closed{display:none;}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 16px;}
.adv-field label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:5px;}
.adv-field select,.adv-field input{width:100%;}
.range-pair{display:flex;align-items:center;gap:6px;}
.range-pair input{width:100%;}
.range-pair span{color:var(--text-muted);font-size:12px;}
.adv-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}

/* Quick row above grid */
.quick-row{display:flex;align-items:center;gap:14px;padding:12px 24px;flex:0 0 auto;}
.search-box{position:relative;flex:0 0 320px;}
.search-box svg{position:absolute;left:10px;top:9px;width:14px;height:14px;color:var(--text-muted);}
.search-box input{width:100%;height:32px;padding-left:32px;}
.legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-secondary);margin-left:auto;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

/* Grid */
.grid-wrap{margin:0 24px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-panel);overflow:auto;max-height:520px;flex:1 1 auto;}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
thead th{position:sticky;top:0;background:var(--bg-subtle);border-bottom:1px solid var(--border-strong);border-right:1px solid var(--border);text-align:left;padding:0;z-index:2;}
thead th.sticky-th{z-index:3;}
.select-th{position:sticky;top:0;left:0;z-index:4;background:var(--bg-subtle);border-right:1px solid var(--border);text-align:center;}
.th-inner{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;}
.th-label{font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.th-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.sort-btn,.filter-btn{border:none;background:none;padding:2px;cursor:pointer;display:flex;border-radius:3px;}
.sort-btn:hover,.filter-btn:hover{background:var(--bg-subtle-2);}
.sort-btn svg polygon{fill:var(--text-muted);}
.sort-btn svg polygon.on{fill:var(--teal-600);}
.filter-btn svg path{fill:var(--text-muted);}
.filter-btn.active svg path{fill:var(--teal-600);}

tbody td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
tbody tr:hover td{background:var(--bg-subtle);}
tbody tr:hover .sticky-cell{background:var(--bg-subtle);}
.select-cell{text-align:center;}
.sticky-cell{position:sticky;background:var(--bg-panel);z-index:1;}
.select-cell.sticky-cell{z-index:1;}
tr.row-dirty td{background:var(--amber-50);}
tr.row-dirty:hover td{background:#F7E9C6;}
tr.row-dirty .sticky-cell{background:var(--amber-50);}
tr.row-locked td{background:var(--blue-50);color:var(--text-secondary);}
tr.row-locked:hover td{background:var(--blue-50);}
tr.row-locked .sticky-cell{background:var(--blue-50);}
tr.flash td{background:var(--teal-50) !important;transition:background-color .9s ease;}
td[data-editable="1"]{cursor:text;}
td.editing{padding:4px 6px;}
.cell-editor{width:100%;height:26px;border:1px solid var(--teal-600);border-radius:4px;padding:0 6px;box-shadow:0 0 0 3px var(--teal-50);}

.mono-text{font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);}
.num-text{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;font-weight:500;white-space:nowrap;}
.badge-gray{background:var(--bg-subtle-2);color:var(--text-secondary);}
.badge-green{background:var(--green-50);color:var(--green-600);}
.badge-blue{background:var(--blue-50);color:var(--blue-600);display:inline-flex;align-items:center;gap:4px;}
.badge-blue svg{width:10px;height:10px;}

.cap-cell{display:flex;align-items:center;gap:8px;}
.cap-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;min-width:22px;}
.cap-bar{width:46px;height:5px;background:var(--bg-subtle-2);border-radius:3px;overflow:hidden;flex:0 0 auto;}
.cap-fill{height:100%;border-radius:3px;}

.mini-btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--bg-panel);cursor:pointer;font-size:12px;color:var(--text-primary);}
.mini-btn:hover{background:var(--bg-subtle);border-color:var(--teal-600);color:var(--teal-700);}
.mini-btn svg{width:12px;height:12px;}

/* Filter dropdown */
.filter-dropdown{position:fixed;width:240px;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:var(--radius);padding:10px;z-index:50;}
.fd-search{width:100%;height:30px;margin-bottom:8px;border:1px solid var(--border-strong);border-radius:4px;padding:0 8px;}
.fd-all{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 2px;border-bottom:1px solid var(--border);margin-bottom:4px;color:var(--text-secondary);}
.fd-list{max-height:190px;overflow-y:auto;}
.fd-item{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 2px;border-radius:3px;cursor:pointer;}
.fd-item:hover{background:var(--bg-subtle);}
.fd-actions{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.fd-actions button{flex:1;height:30px;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-panel);cursor:pointer;font-size:12.5px;}
.fd-actions .fd-apply{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.fd-actions .fd-clear:hover{background:var(--bg-subtle);}
.fd-actions .fd-apply:hover{background:var(--navy-700);}

/* Footer status bar */
.statusbar{background:var(--bg-panel);border-top:1px solid var(--border);padding:9px 24px;display:flex;align-items:center;gap:22px;font-size:12.5px;color:var(--text-secondary);flex:0 0 auto;}
.statusbar b{color:var(--text-primary);font-weight:600;}
.statusbar .hint{margin-left:auto;color:var(--text-muted);}

/* Toast */
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;}
.toast{background:var(--navy-800);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateY(0);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-subtle);}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.8V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-5.2"/></svg>
      </div>
      <div class="brand-text">
        <h1>Quản lý nhóm lớp học phần</h1>
        <p>Hệ đại học chính quy · Phòng Đào tạo</p>
      </div>
    </div>
    <div class="who">
      <span class="who-tag">Học kỳ 1 · 2025-2026</span>
      <div class="avatar">PĐT</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">Học kỳ</span>
      <select id="hocKySelect">
        <option>1_2025-2026</option>
        <option>2_2025-2026</option>
        <option>3_2025-2026</option>
      </select>
    </div>
    <div class="tb-sep"></div>
    <button class="btn btn-primary" id="btnSave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
      Lưu xác nhận
    </button>
    <button class="btn" id="btnGroup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="8" y="14" width="8" height="7" rx="1"/></svg>
      Nhóm lớp
    </button>
    <button class="btn" id="btnUngroup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><path d="M8 17h8"/></svg>
      Bỏ nhóm
    </button>
    <button class="btn" id="btnTransfer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h13M13 3l4 4-4 4"/><path d="M20 17H7M11 21l-4-4 4-4"/></svg>
      Chuyển học kỳ thanh toán
    </button>
    <div class="spacer"></div>
    <button class="btn btn-teal" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Xuất Excel
    </button>
    <button class="btn btn-filter open" id="btnToggleFilter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5Z"/></svg>
      Bộ lọc
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M6 9l6 6 6-6"/></svg>
      <span class="filter-count" id="filterCount" style="display:none;">0</span>
    </button>
  </div>

  <div class="filter-panel" id="filterPanel">
    <div class="adv-grid">
      <div class="adv-field">
        <label>Tên nhóm lớp học phần</label>
        <input type="text" id="advName" class="text-input" placeholder="Nhập tên môn học...">
      </div>
      <div class="adv-field">
        <label>Khoa</label>
        <select id="advKhoa"><option value="">— Tất cả —</option></select>
      </div>
      <div class="adv-field">
        <label>Khoa CN</label>
        <select id="advKhoaCN"><option value="">— Tất cả —</option></select>
      </div>
      <div class="adv-field">
        <label>Hình thức học</label>
        <select id="advHT"><option value="">— Tất cả —</option></select>
      </div>
      <div class="adv-field">
        <label>Cách tổ chức lớp</label>
        <select id="advCachTC"><option value="">— Tất cả —</option></select>
      </div>
      <div class="adv-field">
        <label>Trạng thái</label>
        <select id="advTrangThai"><option value="">— Tất cả —</option></select>
      </div>
      <div class="adv-field">
        <label>Số SV (từ — đến)</label>
        <div class="range-pair">
          <input type="number" id="advSVMin" class="text-input" placeholder="Từ">
          <span>—</span>
          <input type="number" id="advSVMax" class="text-input" placeholder="Đến">
        </div>
      </div>
      <div class="adv-field">
        <label>Số tín chỉ (từ — đến)</label>
        <div class="range-pair">
          <input type="number" id="advTCMin" class="text-input" placeholder="Từ">
          <span>—</span>
          <input type="number" id="advTCMax" class="text-input" placeholder="Đến">
        </div>
      </div>
    </div>
    <div class="adv-actions">
      <button class="btn" id="btnClearFilter">Xoá điều kiện lọc</button>
      <button class="btn btn-primary" id="btnApplyFilter">Tìm kiếm</button>
    </div>
  </div>

  <div class="quick-row">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="quickSearch" class="text-input" placeholder="Tìm theo tên nhóm lớp, mã lớp, phòng học...">
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--teal-600)"></span>Còn chỗ</span>
      <span><span class="dot" style="background:var(--amber-600)"></span>Gần đầy</span>
      <span><span class="dot" style="background:var(--red-600)"></span>Vượt sĩ số</span>
    </div>
  </div>

  <div class="grid-wrap">
    <table>
      <thead id="theadRow"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="statusbar">
    <span>Tổng số: <b id="statTotal">0</b> nhóm lớp</span>
    <span>Đang hiển thị: <b id="statFiltered">0</b></span>
    <span>Đã chọn: <b id="statSelected">0</b></span>
    <span>Tổng SV: <b id="statSV">0</b></span>
    <span>Tổng số TC: <b id="statTC">0</b></span>
    <span class="hint">Nháy đúp vào ô để chỉnh sửa · Lớp đã thanh toán không thể chỉnh sửa</span>
  </div>

</div>

<div class="toast-stack" id="toastStack"></div>

<script>
const KHOA_LIST=['Công nghệ thông tin','Kinh tế','Sư phạm Toán học','Ngoại ngữ','Xây dựng','Nông Lâm Ngư nghiệp','Luật','Giáo dục thể chất - QP'];
const KHOA_CN_MAP={'Công nghệ thông tin':'CNTT','Kinh tế':'KT','Sư phạm Toán học':'SP Toán','Ngoại ngữ':'NN-Anh','Xây dựng':'XD','Nông Lâm Ngư nghiệp':'NLN','Luật':'Luật','Giáo dục thể chất - QP':'GDTC'};
const KHOA_CN_LIST=Object.values(KHOA_CN_MAP);
const HT_HOC_LIST=['Lý thuyết','Thực hành','LT+TH'];
const HT_CHITIET_LIST=['Trực tiếp','Trực tuyến','Kết hợp'];
const TC_LOP_LIST=['Niên chế','Tín chỉ'];
const TT_LIST=['Chưa xác nhận','Đã xác nhận','Đã thanh toán'];
const HK_LIST=['1_2025-2026','2_2025-2026'];

const COLUMNS=[
 {key:'stt',label:'TT',type:'number',width:46,editable:false,sortable:true,filterable:false,sticky:true},
 {key:'tenNhom',label:'Tên nhóm lớp học phần',type:'text',width:260,editable:true,sortable:true,filterable:true,sticky:true},
 {key:'soSV',label:'Số SV',type:'number',width:70,editable:true,sortable:true,filterable:true},
 {key:'hocKy',label:'Học kỳ',type:'select',options:HK_LIST,width:110,editable:true,sortable:true,filterable:true},
 {key:'khoa',label:'Khoa',type:'select',options:KHOA_LIST,width:170,editable:true,sortable:true,filterable:true},
 {key:'soPhong',label:'Số phòng',type:'text',width:90,editable:true,sortable:true,filterable:true},
 {key:'hinhThucHoc',label:'HT học',type:'select',options:HT_HOC_LIST,width:100,editable:true,sortable:true,filterable:true},
 {key:'hinhThucHocChiTiet',label:'HT học chi tiết',type:'select',options:HT_CHITIET_LIST,width:140,editable:true,sortable:true,filterable:true},
 {key:'cachTCLop',label:'Cách TC lớp',type:'select',options:TC_LOP_LIST,width:110,editable:true,sortable:true,filterable:true},
 {key:'chuyen',label:'Chuyên',type:'text',width:90,editable:true,sortable:true,filterable:true},
 {key:'soTC',label:'Số TC',type:'number',width:70,editable:true,sortable:true,filterable:true},
 {key:'lt',label:'LT',type:'number',width:55,editable:true,sortable:true,filterable:true},
 {key:'th',label:'TH',type:'number',width:55,editable:true,sortable:true,filterable:true},
 {key:'tl',label:'TL',type:'number',width:55,editable:true,sortable:true,filterable:true},
 {key:'da',label:'ĐA',type:'number',width:55,editable:true,sortable:true,filterable:true},
 {key:'trangThai',label:'Trạng thái',type:'badge',options:TT_LIST,width:130,editable:true,sortable:true,filterable:true},
 {key:'dakl',label:'ĐAKL',type:'number',width:65,editable:true,sortable:true,filterable:true},
 {key:'qdlt',label:'QĐLT',type:'number',width:65,editable:true,sortable:true,filterable:true},
 {key:'qdth',label:'QĐTH',type:'number',width:65,editable:true,sortable:true,filterable:true},
 {key:'qdtl',label:'QĐTL',type:'number',width:65,editable:true,sortable:true,filterable:true},
 {key:'siSoDKH',label:'Sĩ số ĐKH',type:'capacity',width:120,editable:true,sortable:true,filterable:true},
 {key:'siSoBS',label:'Sĩ số BS',type:'number',width:85,editable:true,sortable:true,filterable:true},
 {key:'khoaCN',label:'Khoa CN',type:'select',options:KHOA_CN_LIST,width:110,editable:true,sortable:true,filterable:true},
 {key:'fileId',label:'File_ID',type:'mono',width:110,editable:false,sortable:true,filterable:true},
 {key:'tongHop',label:'Tổng hợp lại',type:'action',width:110,editable:false,sortable:false,filterable:false},
 {key:'heSoHP',label:'Hệ số HP',type:'number',width:90,editable:true,sortable:true,filterable:true}
];

const stickyOffsets={};
(function(){let cum=40;COLUMNS.forEach(c=>{if(c.sticky){stickyOffsets[c.key]=cum;cum+=c.width;}});})();

function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function parseNum(v,fallback){const n=parseFloat(v);return isNaN(n)?fallback:n;}

function generateData(){
  const SUBJECTS={
    'Công nghệ thông tin':['Lập trình hướng đối tượng','Cấu trúc dữ liệu và giải thuật','Cơ sở dữ liệu','Mạng máy tính','Trí tuệ nhân tạo','Lập trình Web'],
    'Kinh tế':['Kinh tế vi mô','Kinh tế vĩ mô','Nguyên lý kế toán','Quản trị học','Marketing căn bản','Tài chính doanh nghiệp'],
    'Sư phạm Toán học':['Giải tích 1','Đại số tuyến tính','Xác suất thống kê','Phương pháp dạy học Toán','Hình học sơ cấp'],
    'Ngoại ngữ':['Anh văn 1','Anh văn 2','Ngữ âm - Âm vị học','Biên dịch','Kỹ năng nghe nói'],
    'Xây dựng':['Sức bền vật liệu','Bê tông cốt thép 1','Kết cấu thép','Trắc địa','Nền và móng'],
    'Nông Lâm Ngư nghiệp':['Chăn nuôi đại cương','Trồng trọt đại cương','Khoa học đất','Nuôi trồng thủy sản'],
    'Luật':['Luật dân sự','Luật hình sự','Luật hành chính','Luật lao động'],
    'Giáo dục thể chất - QP':['Giáo dục thể chất 1','Giáo dục thể chất 2','Giáo dục quốc phòng 1']
  };
  const COHORTS=['K63A','K63B','K64A','K64B','K65A'];
  const rows=[]; let stt=1, fileSeq=1;
  KHOA_LIST.forEach(khoa=>{
    SUBJECTS[khoa].forEach((subject,si)=>{
      const groupsCount = si%3===0?2:1;
      for(let g=1; g<=groupsCount; g++){
        const soTC = 2 + (stt%3);
        const lt = soTC*15;
        const th = (stt%4===0)? soTC*10 : 0;
        const tl = (stt%5===0)? 10 : 0;
        const da = (stt%7===0)? 15 : 0;
        const soSV = 45 + (stt*7)%50;
        const dkhDelta = ((stt*13)%20)-8;
        const siSoDKH = Math.max(10, soSV+dkhDelta);
        const siSoBS = (stt*3)%6;
        const hinhThucHoc = th>0 ? (lt>0?'LT+TH':'Thực hành') : 'Lý thuyết';
        rows.push({
          id:'r'+stt, stt:stt,
          tenNhom:`${subject}_N0${g}`,
          soSV, hocKy: stt%9===0? HK_LIST[1]:HK_LIST[0],
          khoa, soPhong:`${['A','B','C','D'][stt%4]}${1+(stt%3)}-${100+(stt*3)%20}`,
          hinhThucHoc, hinhThucHocChiTiet: HT_CHITIET_LIST[stt%HT_CHITIET_LIST.length],
          cachTCLop: TC_LOP_LIST[stt%2], chuyen: COHORTS[stt%COHORTS.length],
          soTC, lt, th, tl, da,
          trangThai: stt%9===0? TT_LIST[2] : (stt%3===0? TT_LIST[1] : TT_LIST[0]),
          dakl: (stt%11===0)?1:0, qdlt: Math.round(lt*1.2), qdth: Math.round(th*0.9), qdtl: tl? Math.round(tl*1.1):0,
          siSoDKH, siSoBS,
          khoaCN: KHOA_CN_MAP[khoa],
          fileId:`FHP-2026-${String(fileSeq).padStart(4,'0')}`,
          heSoHP:[1.0,1.2,1.5][stt%3],
          _dirty:false
        });
        stt++; fileSeq++;
      }
    });
  });
  return rows;
}

const state={
  data:[], sortKey:null, sortDir:1, filters:{}, search:'',
  numFilters:{soSV:[-Infinity,Infinity],soTC:[-Infinity,Infinity]},
  selected:new Set()
};

function iconLock(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';}
function iconRefresh(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M5 9a8 8 0 0 1 14-2M19 15a8 8 0 0 1-14 2"/></svg>';}

function badgeHtml(v){
  if(v==='Đã thanh toán') return `<span class="badge badge-blue">${iconLock()}${esc(v)}</span>`;
  if(v==='Đã xác nhận') return `<span class="badge badge-green">${esc(v)}</span>`;
  return `<span class="badge badge-gray">${esc(v)}</span>`;
}
function capacityHtml(row){
  const ratio = row.soSV>0? row.siSoDKH/row.soSV : 0;
  const pct = Math.max(0,Math.min(100,Math.round(ratio*100)));
  let color='var(--teal-600)';
  if(ratio>1) color='var(--red-600)'; else if(ratio>=0.95) color='var(--amber-600)';
  return `<div class="cap-cell"><span class="cap-num">${row.siSoDKH}</span><div class="cap-bar"><div class="cap-fill" style="width:${pct}%;background:${color};"></div></div></div>`;
}
function formatNum(v,key){
  if(key==='heSoHP') return Number(v).toFixed(1);
  return String(v);
}
function cellDisplay(row,col){
  const v = row[col.key];
  switch(col.type){
    case 'badge': return badgeHtml(v);
    case 'capacity': return capacityHtml(row);
    case 'action': return `<button class="mini-btn" data-action="tonghop" title="Tính lại số liệu">${iconRefresh()}<span>Tính lại</span></button>`;
    case 'mono': return `<span class="mono-text">${esc(v)}</span>`;
    case 'number': return `<span class="num-text">${formatNum(v,col.key)}</span>`;
    default: return `<span>${esc(v)}</span>`;
  }
}

function sortIconHtml(key){
  return `<button class="sort-btn" data-key="${key}" title="Sắp xếp" aria-label="Sắp xếp theo cột">
    <svg width="10" height="12" viewBox="0 0 10 12"><polygon class="arrow-up" points="5,0 10,5 0,5"/><polygon class="arrow-down" points="5,12 10,7 0,7"/></svg>
  </button>`;
}
function filterIconHtml(key){
  return `<button class="filter-btn" data-key="${key}" title="Lọc" aria-label="Lọc theo cột">
    <svg width="12" height="12" viewBox="0 0 16 16"><path d="M1 2h14l-5.5 6.5V13l-3 1.5V8.5z"/></svg>
  </button>`;
}
function buildHeaderHTML(){
  const checkboxTh = `<th class="select-th" style="width:40px;min-width:40px;"><input type="checkbox" id="selectAll"></th>`;
  const ths = COLUMNS.map(col=>{
    const stickyStyle = col.sticky? `left:${stickyOffsets[col.key]}px;` : '';
    return `<th data-col="${col.key}" class="${col.sticky?'sticky-th':''}" style="width:${col.width}px;min-width:${col.width}px;${stickyStyle}">
      <div class="th-inner">
        <span class="th-label" title="${esc(col.label)}">${esc(col.label)}</span>
        <span class="th-actions">${col.sortable?sortIconHtml(col.key):''}${col.filterable?filterIconHtml(col.key):''}</span>
      </div>
    </th>`;
  }).join('');
  return checkboxTh+ths;
}

function renderRowHTML(row){
  const checkboxCell = `<td class="select-cell sticky-cell" style="left:0;width:40px;min-width:40px;"><input type="checkbox" class="row-check" ${state.selected.has(row.id)?'checked':''}></td>`;
  const cells = COLUMNS.map(col=>{
    const stickyStyle = col.sticky? `left:${stickyOffsets[col.key]}px;` : '';
    return `<td data-col="${col.key}" data-editable="${col.editable?'1':'0'}" class="${col.sticky?'sticky-cell':''}" style="width:${col.width}px;min-width:${col.width}px;${stickyStyle}">${cellDisplay(row,col)}</td>`;
  }).join('');
  const rowClass = [row._dirty?'row-dirty':'', row.trangThai==='Đã thanh toán'?'row-locked':''].filter(Boolean).join(' ');
  return `<tr data-id="${row.id}" class="${rowClass}">${checkboxCell}${cells}</tr>`;
}

function getRows(){
  let rows = state.data.filter(r=>{
    if(state.search){
      const s = state.search.toLowerCase();
      const hay = (r.tenNhom+' '+r.fileId+' '+r.chuyen+' '+r.soPhong).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    for(const key in state.filters){
      const allowed = state.filters[key];
      if(allowed && !allowed.has(String(r[key]))) return false;
    }
    const [svMin,svMax]=state.numFilters.soSV;
    if(r.soSV<svMin||r.soSV>svMax) return false;
    const [tcMin,tcMax]=state.numFilters.soTC;
    if(r.soTC<tcMin||r.soTC>tcMax) return false;
    return true;
  });
  if(state.sortKey){
    const key=state.sortKey, dir=state.sortDir;
    rows = rows.slice().sort((a,b)=>{
      let av=a[key], bv=b[key];
      if(typeof av==='number' && typeof bv==='number') return (av-bv)*dir;
      av=String(av).toLowerCase(); bv=String(bv).toLowerCase();
      return av.localeCompare(bv)*dir;
    });
  }
  return rows;
}

const tbody = document.getElementById('tbody');
const thead = document.getElementById('theadRow');

function renderAll(){
  const rows = getRows();
  tbody.innerHTML = rows.map(renderRowHTML).join('');
  updateHeaderIndicators();
  updateFooter(rows);
  updateSelectAllState(rows);
}

function updateHeaderIndicators(){
  document.querySelectorAll('.sort-btn').forEach(btn=>{
    const key = btn.dataset.key;
    const up = btn.querySelector('.arrow-up'), down = btn.querySelector('.arrow-down');
    up.classList.toggle('on', state.sortKey===key && state.sortDir===1);
    down.classList.toggle('on', state.sortKey===key && state.sortDir===-1);
  });
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.classList.toggle('active', !!state.filters[btn.dataset.key]);
  });
}
function updateFooter(rows){
  const totalSV = rows.reduce((s,r)=>s+Number(r.soSV||0),0);
  const totalTC = rows.reduce((s,r)=>s+Number(r.soTC||0),0);
  document.getElementById('statTotal').textContent = state.data.length;
  document.getElementById('statFiltered').textContent = rows.length;
  document.getElementById('statSelected').textContent = state.selected.size;
  document.getElementById('statSV').textContent = totalSV.toLocaleString('vi-VN');
  document.getElementById('statTC').textContent = totalTC.toLocaleString('vi-VN');
}
function updateSelectAllState(rows){
  const cb = document.getElementById('selectAll');
  if(!cb) return;
  const selCount = rows.filter(r=>state.selected.has(r.id)).length;
  cb.checked = rows.length>0 && selCount===rows.length;
  cb.indeterminate = selCount>0 && selCount<rows.length;
}
function updateFilterCountBadge(){
  const n = Object.keys(state.filters).length
    + (state.numFilters.soSV[0]!==-Infinity||state.numFilters.soSV[1]!==Infinity?1:0)
    + (state.numFilters.soTC[0]!==-Infinity||state.numFilters.soTC[1]!==Infinity?1:0)
    + (state.search?1:0);
  const badge = document.getElementById('filterCount');
  if(n>0){badge.style.display='inline-block';badge.textContent=n;} else {badge.style.display='none';}
}

function toggleSort(key){
  if(state.sortKey===key){
    if(state.sortDir===1){state.sortDir=-1;}
    else {state.sortKey=null; state.sortDir=1;}
  } else { state.sortKey=key; state.sortDir=1; }
  renderAll();
}

let filterDropdownEl=null, openFilterKey=null;
function closeFilterDropdown(){
  if(filterDropdownEl){filterDropdownEl.remove();filterDropdownEl=null;openFilterKey=null;document.removeEventListener('click',outsideClickHandler);}
}
function outsideClickHandler(e){
  if(filterDropdownEl && !filterDropdownEl.contains(e.target) && !e.target.closest('.filter-btn')) closeFilterDropdown();
}
function openFilterDropdown(key,btn){
  closeFilterDropdown();
  const allValues = Array.from(new Set(state.data.map(r=>String(r[key])))).sort((a,b)=>a.localeCompare(b));
  const currentAllowed = state.filters[key];
  const rect = btn.getBoundingClientRect();
  const div = document.createElement('div');
  div.className='filter-dropdown';
  div.style.top=(rect.bottom+6)+'px';
  div.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-256))+'px';
  div.innerHTML = `
    <input type="text" class="fd-search" placeholder="Tìm giá trị...">
    <label class="fd-all"><input type="checkbox" class="fd-selectall" ${(!currentAllowed||currentAllowed.size===allValues.length)?'checked':''}> Chọn tất cả</label>
    <div class="fd-list">${allValues.map(v=>`<label class="fd-item"><input type="checkbox" class="fd-cb" value="${esc(v)}" ${(!currentAllowed||currentAllowed.has(v))?'checked':''}>${esc(v)||'(trống)'}</label>`).join('')}</div>
    <div class="fd-actions"><button class="fd-clear">Xoá lọc</button><button class="fd-apply">Áp dụng</button></div>
  `;
  document.body.appendChild(div);
  filterDropdownEl=div; openFilterKey=key;
  div.querySelector('.fd-search').addEventListener('input', e=>{
    const q=e.target.value.toLowerCase();
    div.querySelectorAll('.fd-item').forEach(lbl=>{lbl.style.display=lbl.textContent.toLowerCase().includes(q)?'flex':'none';});
  });
  div.querySelector('.fd-selectall').addEventListener('change', e=>{
    div.querySelectorAll('.fd-cb').forEach(cb=>cb.checked=e.target.checked);
  });
  div.querySelector('.fd-clear').addEventListener('click', ()=>{
    delete state.filters[key]; closeFilterDropdown(); renderAll(); updateFilterCountBadge();
  });
  div.querySelector('.fd-apply').addEventListener('click', ()=>{
    const checked = Array.from(div.querySelectorAll('.fd-cb:checked')).map(cb=>cb.value);
    if(checked.length===allValues.length){delete state.filters[key];} else {state.filters[key]=new Set(checked);}
    closeFilterDropdown(); renderAll(); updateFilterCountBadge();
  });
  setTimeout(()=>document.addEventListener('click',outsideClickHandler),0);
}

function showToast(msg){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  stack.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),250);},2600);
}
function flashRow(id){
  const tr = tbody.querySelector(`tr[data-id="${id}"]`);
  if(!tr) return;
  tr.classList.add('flash');
  setTimeout(()=>tr.classList.remove('flash'),900);
}

function startEdit(td,row,col){
  td.classList.add('editing');
  let inputHtml;
  if(col.type==='select' || col.type==='badge'){
    const listId = 'dl_' + col.key;
    inputHtml = `<input type="text" class="cell-editor" list="${listId}" value="${esc(row[col.key])}">` +
                `<datalist id="${listId}">${col.options.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
  } else if(col.type==='number' || col.type==='capacity'){
    const step = col.key==='heSoHP'?'0.1':'1';
    inputHtml = `<input type="number" step="${step}" class="cell-editor" value="${row[col.key]}">`;
  } else {
    inputHtml = `<input type="text" class="cell-editor" value="${esc(row[col.key])}">`;
  }
  td.innerHTML = inputHtml;
  const input = td.querySelector('.cell-editor');
  input.focus();
  if(input.select) input.select();
  function commit(){
    let val = input.value;
    if(col.type==='number' || col.type==='capacity'){
      val = col.key==='heSoHP' ? (parseFloat(val)||0) : (parseInt(val)||0);
    }
    row[col.key]=val;
    row._dirty=true;
    renderAll();
  }
  function cancel(){
    td.classList.remove('editing');
    td.innerHTML = cellDisplay(row,col);
  }
  input.addEventListener('blur', commit, {once:true});
  input.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ input.blur(); }
    else if(ev.key==='Escape'){ input.removeEventListener('blur',commit); cancel(); }
  });
  if(col.type==='select' || col.type==='badge'){
    input.addEventListener('change', ()=>input.blur());
  }
}

tbody.addEventListener('click', e=>{
  const td = e.target.closest('td[data-editable="1"]');
  if(!td) return;
  const tr = td.closest('tr');
  const row = state.data.find(r=>r.id===tr.dataset.id);
  if(!row) return;
  if(row.trangThai==='Đã thanh toán'){ showToast('Không thể sửa: nhóm lớp này đã thanh toán'); return; }
  const col = COLUMNS.find(c=>c.key===td.dataset.col);
  startEdit(td,row,col);
});
tbody.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-action="tonghop"]');
  if(!btn) return;
  const tr = btn.closest('tr');
  const row = state.data.find(r=>r.id===tr.dataset.id);
  if(!row) return;
  row.soTC = Math.round((row.lt/15 + row.th/30 + row.tl/15 + row.da/30)*10)/10 || row.soTC;
  row.qdlt = Math.round(row.lt*1.2);
  row.qdth = Math.round(row.th*0.9);
  row._dirty = true;
  renderAll();
  flashRow(row.id);
  showToast('Đã tổng hợp lại số liệu — nhóm '+row.tenNhom);
});
tbody.addEventListener('change', e=>{
  const cb = e.target.closest('input.row-check');
  if(!cb) return;
  const id = cb.closest('tr').dataset.id;
  if(cb.checked) state.selected.add(id); else state.selected.delete(id);
  updateFooter(getRows()); updateSelectAllState(getRows());
});
thead.addEventListener('click', e=>{
  const sortBtn = e.target.closest('.sort-btn');
  if(sortBtn){ toggleSort(sortBtn.dataset.key); return; }
  const filterBtn = e.target.closest('.filter-btn');
  if(filterBtn){ openFilterDropdown(filterBtn.dataset.key, filterBtn); return; }
});

function fillSelectOptions(el, values){
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value=v; opt.textContent=v;
    el.appendChild(opt);
  });
}

function bindStaticEvents(){
  document.getElementById('quickSearch').addEventListener('input', e=>{
    state.search = e.target.value;
    document.getElementById('advName').value = e.target.value;
    renderAll(); updateFilterCountBadge();
  });
  document.getElementById('btnToggleFilter').addEventListener('click', function(){
    const panel = document.getElementById('filterPanel');
    panel.classList.toggle('closed');
    this.classList.toggle('open', !panel.classList.contains('closed'));
  });
  document.getElementById('btnApplyFilter').addEventListener('click', ()=>{
    const map = [['advKhoa','khoa'],['advKhoaCN','khoaCN'],['advHT','hinhThucHoc'],['advCachTC','cachTCLop'],['advTrangThai','trangThai']];
    map.forEach(([id,key])=>{
      const v = document.getElementById(id).value;
      if(v){ state.filters[key]=new Set([v]); } else { delete state.filters[key]; }
    });
    state.numFilters.soSV=[parseNum(document.getElementById('advSVMin').value,-Infinity), parseNum(document.getElementById('advSVMax').value,Infinity)];
    state.numFilters.soTC=[parseNum(document.getElementById('advTCMin').value,-Infinity), parseNum(document.getElementById('advTCMax').value,Infinity)];
    state.search = document.getElementById('advName').value;
    document.getElementById('quickSearch').value = state.search;
    renderAll(); updateFilterCountBadge();
  });
  document.getElementById('btnClearFilter').addEventListener('click', ()=>{
    document.querySelectorAll('.adv-field input, .adv-field select').forEach(el=>el.value='');
    state.filters={}; state.search='';
    state.numFilters={soSV:[-Infinity,Infinity],soTC:[-Infinity,Infinity]};
    document.getElementById('quickSearch').value='';
    renderAll(); updateFilterCountBadge();
  });
  document.getElementById('btnSave').addEventListener('click', ()=>{
    const n = state.data.filter(r=>r._dirty).length;
    state.data.forEach(r=>r._dirty=false);
    renderAll();
    showToast(n>0? `Đã lưu xác nhận ${n} thay đổi` : 'Không có thay đổi nào cần lưu');
  });
  document.getElementById('btnGroup').addEventListener('click', ()=>{
    if(state.selected.size<2){ showToast('Chọn ít nhất 2 nhóm lớp để gộp nhóm'); return; }
    showToast(`Đã gộp ${state.selected.size} nhóm lớp học phần`);
  });
  document.getElementById('btnUngroup').addEventListener('click', ()=>{
    if(state.selected.size===0){ showToast('Chọn ít nhất 1 nhóm lớp để bỏ nhóm'); return; }
    showToast(`Đã bỏ nhóm ${state.selected.size} nhóm lớp học phần`);
  });
  document.getElementById('btnTransfer').addEventListener('click', ()=>{
    if(state.selected.size===0){ showToast('Chọn ít nhất 1 nhóm lớp để chuyển học kỳ thanh toán'); return; }
    showToast(`Đã chuyển ${state.selected.size} nhóm lớp sang học kỳ thanh toán`);
  });
  document.getElementById('btnExport').addEventListener('click', ()=>{
    showToast(`Đã xuất ${getRows().length} dòng ra file Excel`);
  });
}

function init(){
  state.data = generateData();
  thead.innerHTML = `<tr>${buildHeaderHTML()}</tr>`;
  document.getElementById('selectAll').addEventListener('change', e=>{
    const checked = e.target.checked;
    const rows = getRows();
    rows.forEach(r=>{ if(checked) state.selected.add(r.id); else state.selected.delete(r.id); });
    renderAll();
  });
  fillSelectOptions(document.getElementById('advKhoa'), KHOA_LIST);
  fillSelectOptions(document.getElementById('advKhoaCN'), KHOA_CN_LIST);
  fillSelectOptions(document.getElementById('advHT'), HT_HOC_LIST);
  fillSelectOptions(document.getElementById('advCachTC'), TC_LOP_LIST);
  fillSelectOptions(document.getElementById('advTrangThai'), TT_LIST);
  bindStaticEvents();
  renderAll();
}
init();
</script>
